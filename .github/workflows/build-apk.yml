name: Build R.E.V. Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install legacy Android SDK packages
        run: |
          sdkmanager "platforms;android-22" "build-tools;22.0.1"

      - name: Switch to Java 8 for the legacy Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download official WowWee R.E.V. Android SDK sample
        run: |
          git clone --depth 1 https://github.com/WowWeeLabs/REV-Android-SDK.git rev-sdk

      - name: Build debug APK
        working-directory: rev-sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REV-Android-SDK-debug-APK
          path: rev-sdk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

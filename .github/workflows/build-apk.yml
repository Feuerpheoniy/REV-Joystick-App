name: Build R.E.V. Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install legacy Android SDK runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32stdc++6 lib32z1

      - name: Install legacy Android SDK packages
        run: |
          sdkmanager "platforms;android-22" "build-tools;22.0.1"
          file "$ANDROID_HOME/build-tools/22.0.1/aapt"
          ldd "$ANDROID_HOME/build-tools/22.0.1/aapt" || true
          "$ANDROID_HOME/build-tools/22.0.1/aapt" version

      - name: Switch to Java 8 for the legacy Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download official WowWee R.E.V. Android SDK sample
        run: |
          git clone --depth 1 https://github.com/WowWeeLabs/REV-Android-SDK.git rev-sdk

      - name: Simplify the official drive screen
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java = Path("app/src/main/java/com/wowwee/revandroidsampleproject/fragments/DriveViewFragment.java")
          s = java.read_text()
          needle = "Set led to blue color when game start"
          insert = """// Simple driving mode: hide combat, AI, health and tracking controls.
                  btnAI.setVisibility(View.GONE);
                  btnFire.setVisibility(View.GONE);
                  spTrackingMode.setVisibility(View.GONE);
                  spGun.setVisibility(View.GONE);
                  tvHealth.setVisibility(View.GONE);
                  tvAiHealth.setVisibility(View.GONE);

                  """ + needle
          if needle not in s:
              raise SystemExit("Could not find drive-screen insertion marker")
          java.write_text(s.replace(needle, insert, 1))
          strings = Path("app/src/main/res/values/strings.xml")
          t = strings.read_text().replace("<string name=" + chr(34) + "app_name" + chr(34) + ">RevSampleProject</string>", "<string name=" + chr(34) + "app_name" + chr(34) + ">REV Joystick</string>")
          strings.write_text(t)
          PY

      - name: Disable legacy PNG crunching
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          needle = '    buildToolsVersion "22.0.1"'
          replacement = needle + '\n    aaptOptions { cruncherEnabled = false }'
          if needle not in s:
              raise SystemExit("Could not find legacy buildToolsVersion setting")
          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Build debug APK
        working-directory: rev-sdk
        env:
          SLAVE_AAPT_TIMEOUT: "180"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=1 --console=plain --stacktrace

      - name: Locate generated APK
        run: |
          find rev-sdk/app/build/outputs -type f -name '*.apk' -print
          test -n "$(find rev-sdk/app/build/outputs -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REV-Android-SDK-debug-APK
          path: rev-sdk/app/build/outputs/**/*.apk
          if-no-files-found: error

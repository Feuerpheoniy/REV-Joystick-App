name: Build R.E.V. Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install legacy Android SDK runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32stdc++6 lib32z1
      - name: Install legacy Android SDK packages
        run: |
          sdkmanager "platforms;android-22" "build-tools;22.0.1"
          "$ANDROID_HOME/build-tools/22.0.1/aapt" version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Download official WowWee R.E.V. Android SDK sample
        run: git clone --depth 1 https://github.com/WowWeeLabs/REV-Android-SDK.git rev-sdk
      - name: Copy uploaded time-travel sound into Android resources
        run: |
          test -s time_travel.mp3
          mkdir -p rev-sdk/app/src/main/res/raw
          cp time_travel.mp3 rev-sdk/app/src/main/res/raw/time_travel.mp3
      - name: Add always-visible time-travel button
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          xml = Path("app/src/main/res/layout/fragment_drive.xml")
          x = xml.read_text()
          button = '''
              <Button
                  android:id="@+id/btn_time_travel"
                  android:layout_width="190dp"
                  android:layout_height="104dp"
                  android:layout_centerHorizontal="true"
                  android:layout_above="@id/spTrackingMode"
                  android:layout_marginBottom="12dp"
                  android:background="@drawable/flux_button"
                  android:text="ZEITREISE"
                  android:contentDescription="Zeitreise-Simulation starten"
                  android:minHeight="104dp"
                  android:textColor="#EAFBFF"
                  android:textStyle="bold"
                  android:textSize="14sp"
                  android:elevation="12dp" />
          '''
          if "btn_time_travel" not in x:
              x = x.replace("</RelativeLayout>", button + "\n</RelativeLayout>")
          xml.write_text(x)
          java = Path("app/src/main/java/com/wowwee/revandroidsampleproject/fragments/DriveViewFragment.java")
          s = java.read_text()
          marker = "\t\t// Set led to blue color when game start"
          if "btn_time_travel" not in s:
              idx = s.find(marker)
              if idx < 0: raise SystemExit("Could not locate exact DriveViewFragment insertion comment")
              addition = """\t\tButton timeTravel = (Button)view.findViewById(R.id.btn_time_travel);
          timeTravel.setCompoundDrawablesWithIntrinsicBounds(null, getResources().getDrawable(R.drawable.flux_capacitor), null, null);
          timeTravel.setCompoundDrawablePadding(2);
          timeTravel.setPadding(12, 4, 12, 4);
          \t\ttimeTravel.setOnClickListener(new View.OnClickListener() {
          \t\t\t@Override public void onClick(View v) {
                v.performHapticFeedback(android.view.HapticFeedbackConstants.VIRTUAL_KEY);
          \t\t\t\tfinal android.media.MediaPlayer timeTravelPlayer = android.media.MediaPlayer.create(getActivity(), R.raw.time_travel);
                if (timeTravelPlayer != null) {
                    timeTravelPlayer.setOnCompletionListener(new android.media.MediaPlayer.OnCompletionListener() {
                        @Override public void onCompletion(android.media.MediaPlayer player) {
                            player.release();
                        }
                    });
                    timeTravelPlayer.start();
                }
          \t\t\t}
          \t\t});
          \t\ttimeTravel.bringToFront();

          """
              s = s[:idx] + addition + s[idx:]
          java.write_text(s)
          drawable = Path("app/src/main/res/drawable/flux_button.xml")
          drawable.parent.mkdir(parents=True, exist_ok=True)
          drawable.write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#07182C" android:centerColor="#123E63" android:endColor="#061321" android:angle="90"/>
              <corners android:radius="16dp"/>
              <stroke android:width="2dp" android:color="#65DFFF"/>
              <padding android:left="10dp" android:top="6dp" android:right="10dp" android:bottom="6dp"/>
          </shape>''')
          vector = Path("app/src/main/res/drawable/flux_capacitor.xml")
          vector.write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="52dp" android:height="58dp" android:viewportWidth="100" android:viewportHeight="100">
              <path android:pathData="M18,12 L50,50 L82,12 M50,50 L50,92" android:strokeColor="#2B9DDA" android:strokeWidth="18" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="@android:color/transparent"/>
              <path android:pathData="M18,12 L50,50 L82,12 M50,50 L50,92" android:strokeColor="#DDFBFF" android:strokeWidth="6" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="@android:color/transparent"/>
          </vector>''')
          PY
      - name: Improve safe joystick Bluetooth drive loop
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/wowwee/revandroidsampleproject/fragments/DriveViewFragment.java")
          s = p.read_text()
          start = s.find("class JoystickRunnable implements Runnable {")
          end = s.find("\n\t//================================================================================\n\t// REVRobot callback", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate JoystickRunnable block")
          replacement = """class JoystickRunnable implements Runnable {
          \t\tpublic void run() {
          \t\t\tboolean wasMoving = false;
          \t\t\twhile (!Thread.currentThread().isInterrupted()) {
          \t\t\t\tboolean moving = driveEnabled && (movementVector[0] != 0 || movementVector[1] != 0);
          \t\t\t\tREVRobot robot = REVRobotFinder.getInstance().firstConnectedREV();
          \t\t\t\tif (robot != null && !robot.isDead()) {
          \t\t\t\t\tif (moving) {
          \t\t\t\t\t\tsendVector[0] = movementVector[0];
          \t\t\t\t\t\tsendVector[1] = movementVector[1];
          \t\t\t\t\t\tif (sendVector[1] < 0) {
          \t\t\t\t\t\t\tsendVector[0] = -sendVector[0];
          \t\t\t\t\t\t}
          \t\t\t\t\t\trobot.revDrive(sendVector, DEFAULT_DRIVE_SPEED, DEFAULT_TURN_SPEED);
          \t\t\t\t\t\twasMoving = true;
          \t\t\t\t\t} else if (wasMoving) {
          \t\t\t\t\t\trobot.revDrive(new float[]{0, 0}, DEFAULT_DRIVE_SPEED, DEFAULT_TURN_SPEED);
          \t\t\t\t\t\twasMoving = false;
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t\ttry {
          \t\t\t\t\tThread.sleep(50);
          \t\t\t\t} catch (InterruptedException e) {
          \t\t\t\t\tThread.currentThread().interrupt();
          \t\t\t\t}
          \t\t\t}
          \t\t}
          \t}"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Manage joystick thread with fragment lifecycle
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/wowwee/revandroidsampleproject/fragments/DriveViewFragment.java")
          s = p.read_text()
          field = "\tprotected boolean isJoystickTimerRunning = false;"
          if "private Thread joystickThread;" not in s:
              s = s.replace(field, field + "\n\tprivate Thread joystickThread;", 1)
          old = """\t\tThread newThread = new Thread(new JoystickRunnable());
          \t\tnewThread.start();
          \t\tisJoystickTimerRunning = true;"""
          if old in s:
              s = s.replace(old, "\t\tstartJoystickLoop();", 1)
          old_resume = """\t\tif(!isJoystickTimerRunning) {
          \t\t\tThread newThread = new Thread(new JoystickRunnable());
          \t\t\tnewThread.start();
          \t\t\tisJoystickTimerRunning = true;
          \t\t}"""
          if old_resume in s:
              s = s.replace(old_resume, "\t\tstartJoystickLoop();", 1)
          if "private void startJoystickLoop()" not in s:
              marker = "\n\tprivate void resumeDriveViewFragment() {"
              methods = """
          \n\tprivate synchronized void startJoystickLoop() {
          \t\tif (joystickThread == null || !joystickThread.isAlive()) {
          \t\t\tisJoystickTimerRunning = true;
          \t\t\tjoystickThread = new Thread(new JoystickRunnable(), "REV-Joystick");
          \t\t\tjoystickThread.start();
          \t\t}
          \t}

          \tprivate synchronized void stopJoystickLoop() {
          \t\tisJoystickTimerRunning = false;
          \t\tif (joystickThread != null) {
          \t\t\tjoystickThread.interrupt();
          \t\t\tjoystickThread = null;
          \t\t}
          \t}
          """
              if marker not in s: raise SystemExit("Could not find lifecycle helper insertion point")
              s = s.replace(marker, methods + marker, 1)
          s = s.replace("\t\tisJoystickTimerRunning = false;\n\t}\n\n\t@Override\n\tpublic void onPause()", "\t\tstopJoystickLoop();\n\t}\n\n\t@Override\n\tpublic void onPause()", 1)
          pause_marker = "\t\tif(joystickTimer != null) {\n\t\t\tjoystickTimer.cancel();\n\t\t\tjoystickTimer.purge();\n\t\t\tjoystickTimer = null;\n\t\t}\n\t\tisJoystickTimerRunning = false;"
          if pause_marker in s:
              s = s.replace(pause_marker, pause_marker.replace("\t\tisJoystickTimerRunning = false;", "\t\tstopJoystickLoop();"), 1)
          p.write_text(s)
          PY
      - name: Disable legacy PNG crunching
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          needle = '    buildToolsVersion "22.0.1"'
          if needle not in s: raise SystemExit("Could not find legacy buildToolsVersion setting")
          if "cruncherEnabled = false" not in s:
              s = s.replace(needle, needle + chr(10) + '    aaptOptions { cruncherEnabled = false }', 1)
          # Android 15 blockiert Installationen mit targetSdkVersion unter 24.
          target = '    targetSdkVersion 22'
          if target not in s:
              raise SystemExit("Could not find expected targetSdkVersion 22 setting")
          s = s.replace(target, '    targetSdkVersion 24', 1)
          if '    targetSdkVersion 24' not in s:
              raise SystemExit("targetSdkVersion was not updated")
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: rev-sdk
        env:
          SLAVE_AAPT_TIMEOUT: "180"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=1 --console=plain --stacktrace
      - name: Verify APK output
        run: |
          APK="$(find rev-sdk/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "APK generated: $APK"
      - uses: actions/upload-artifact@v4
        with:
          name: REV-Time-Travel-debug-APK
          path: rev-sdk/app/build/outputs/**/*.apk
          if-no-files-found: error

name: Build R.E.V. Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "app/src/main/res/raw/**"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install legacy Android SDK runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32stdc++6 lib32z1
      - name: Install legacy Android SDK packages
        run: |
          sdkmanager "platforms;android-22" "build-tools;22.0.1"
          "$ANDROID_HOME/build-tools/22.0.1/aapt" version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Download official WowWee R.E.V. Android SDK sample
        run: |
          git clone --depth 1 https://github.com/WowWeeLabs/REV-Android-SDK.git rev-sdk
          mkdir -p rev-sdk/app/src/main/res/raw
          cp app/src/main/res/raw/startup.mp3 rev-sdk/app/src/main/res/raw/
          cp app/src/main/res/raw/time_travel.mp3 rev-sdk/app/src/main/res/raw/
      - name: Add Flux Capacitor button and sound playback
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java = Path("app/src/main/java/com/wowwee/revandroidsampleproject/fragments/DriveViewFragment.java")
          s = java.read_text()
          s = s.replace("import android.graphics.Bitmap;", "import android.graphics.Bitmap;\\nimport android.media.MediaPlayer;")
          s = s.replace("private Button btnFire;", "private Button btnFire;\\n\\tprivate MediaPlayer effectPlayer;")
          marker = "Set led to blue color when game start"
          idx = s.find(marker)
          if idx < 0: raise SystemExit("Drive screen insertion point not found")
          addition = """// Custom startup sound and always-visible time-travel control.
          playEffect(R.raw.startup);
          Button timeTravel = (Button)view.findViewById(R.id.btn_time_travel);
          timeTravel.bringToFront();
          timeTravel.setOnClickListener(new View.OnClickListener() {
              @Override public void onClick(View v) { playEffect(R.raw.time_travel); }
          });
          """
          s = s[:idx] + addition + s[idx:]
          method = """
          private void playEffect(int soundResource) {
              if (effectPlayer != null) { effectPlayer.release(); effectPlayer = null; }
              effectPlayer = MediaPlayer.create(getActivity(), soundResource);
              if (effectPlayer != null) {
                  effectPlayer.setOnCompletionListener(new MediaPlayer.OnCompletionListener() {
                      @Override public void onCompletion(MediaPlayer player) {
                          player.release();
                          if (effectPlayer == player) effectPlayer = null;
                      }
                  });
                  effectPlayer.start();
              }
          }
          """
          s = s.replace("private void resumeDriveViewFragment()", method + "\\nprivate void resumeDriveViewFragment()")
          java.write_text(s)
          xml = Path("app/src/main/res/layout/fragment_drive.xml")
          x = xml.read_text()
          button = '''
              <Button
                  android:id="@+id/btn_time_travel"
                  android:layout_width="190dp"
                  android:layout_height="64dp"
                  android:layout_centerHorizontal="true"
                  android:layout_alignParentBottom="true"
                  android:layout_marginBottom="12dp"
                  android:background="@drawable/flux_button"
                  android:text="⚡ ZEITREISE"
                  android:textColor="#EAFBFF"
                  android:textStyle="bold"
                  android:textSize="16sp"
                  android:elevation="12dp" />
          '''
          if "btn_time_travel" not in x: x = x.replace("    <FrameLayout", button + "\\n    <FrameLayout")
          xml.write_text(x)
          strings = Path("app/src/main/res/values/strings.xml")
          t = strings.read_text().replace("<string name=" + chr(34) + "app_name" + chr(34) + ">RevSampleProject</string>", "<string name=" + chr(34) + "app_name" + chr(34) + ">REV Joystick - Time Travel</string>")
          strings.write_text(t)
          drawable = Path("app/src/main/res/drawable/flux_button.xml")
          drawable.parent.mkdir(parents=True, exist_ok=True)
          drawable.write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#07182C" android:centerColor="#123E63" android:endColor="#061321" android:angle="90"/>
              <corners android:radius="16dp"/>
              <stroke android:width="2dp" android:color="#65DFFF"/>
              <padding android:left="10dp" android:top="6dp" android:right="10dp" android:bottom="6dp"/>
          </shape>''')
          PY
      - name: Disable legacy PNG crunching
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          needle = '    buildToolsVersion "22.0.1"'
          if needle not in s: raise SystemExit("Could not find legacy buildToolsVersion setting")
          p.write_text(s.replace(needle, needle + '\\n    aaptOptions { cruncherEnabled = false }', 1))
          PY
      - name: Build debug APK
        working-directory: rev-sdk
        env:
          SLAVE_AAPT_TIMEOUT: "180"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=1 --console=plain --stacktrace
      - name: Locate generated APK
        run: |
          find rev-sdk/app/build/outputs -type f -name '*.apk' -print
          test -n "$(find rev-sdk/app/build/outputs -type f -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: REV-Time-Travel-debug-APK
          path: rev-sdk/app/build/outputs/**/*.apk
          if-no-files-found: error

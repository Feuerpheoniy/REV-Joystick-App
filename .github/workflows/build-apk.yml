name: Build R.E.V. Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install legacy Android SDK runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32stdc++6 lib32z1
      - name: Install legacy Android SDK packages
        run: |
          sdkmanager "platforms;android-22" "build-tools;22.0.1"
          "$ANDROID_HOME/build-tools/22.0.1/aapt" version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Download official WowWee R.E.V. Android SDK sample
        run: git clone --depth 1 https://github.com/WowWeeLabs/REV-Android-SDK.git rev-sdk
      - name: Add always-visible time-travel button
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          xml = Path("app/src/main/res/layout/fragment_drive.xml")
          x = xml.read_text()
          button = '''
              <Button
                  android:id="@+id/btn_time_travel"
                  android:layout_width="190dp"
                  android:layout_height="64dp"
                  android:layout_centerHorizontal="true"
                  android:layout_alignParentBottom="true"
                  android:layout_marginBottom="12dp"
                  android:background="@drawable/flux_button"
                  android:text="ZEITREISE"
                  android:textColor="#EAFBFF"
                  android:textStyle="bold"
                  android:textSize="16sp"
                  android:elevation="12dp" />
          '''
          if "btn_time_travel" not in x:
              x = x.replace("</RelativeLayout>", button + "\n</RelativeLayout>")
          xml.write_text(x)
          java = Path("app/src/main/java/com/wowwee/revandroidsampleproject/fragments/DriveViewFragment.java")
          s = java.read_text()
          marker = "\t\t// Set led to blue color when game start"
          if "btn_time_travel" not in s:
              idx = s.find(marker)
              if idx < 0: raise SystemExit("Could not locate exact DriveViewFragment insertion comment")
              addition = """\t\tButton timeTravel = (Button)view.findViewById(R.id.btn_time_travel);
          \t\ttimeTravel.setOnClickListener(new View.OnClickListener() {
          \t\t\t@Override public void onClick(View v) {
          \t\t\t\tandroid.widget.Toast.makeText(getActivity(), "Zeitreise-Sound wird im nächsten Schritt integriert", android.widget.Toast.LENGTH_SHORT).show();
          \t\t\t}
          \t\t});
          \t\ttimeTravel.bringToFront();

          """
              s = s[:idx] + addition + s[idx:]
          java.write_text(s)
          drawable = Path("app/src/main/res/drawable/flux_button.xml")
          drawable.parent.mkdir(parents=True, exist_ok=True)
          drawable.write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#07182C" android:centerColor="#123E63" android:endColor="#061321" android:angle="90"/>
              <corners android:radius="16dp"/>
              <stroke android:width="2dp" android:color="#65DFFF"/>
              <padding android:left="10dp" android:top="6dp" android:right="10dp" android:bottom="6dp"/>
          </shape>''')
          PY
      - name: Disable legacy PNG crunching
        working-directory: rev-sdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          needle = '    buildToolsVersion "22.0.1"'
          if needle not in s: raise SystemExit("Could not find legacy buildToolsVersion setting")
          if "cruncherEnabled = false" not in s:
              s = s.replace(needle, needle + chr(10) + '    aaptOptions { cruncherEnabled = false }', 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: rev-sdk
        env:
          SLAVE_AAPT_TIMEOUT: "180"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=1 --console=plain --stacktrace
      - name: Verify APK output
        run: |
          APK="$(find rev-sdk/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "APK generated: $APK"
      - uses: actions/upload-artifact@v4
        with:
          name: REV-Time-Travel-debug-APK
          path: rev-sdk/app/build/outputs/**/*.apk
          if-no-files-found: error
